name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scenario tests for review.yml
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pyyaml==6.0.3
          .venv/bin/python -m unittest discover -s tests -v
