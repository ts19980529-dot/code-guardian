# Code Guardian: AI code, security and dependency review on each pull request,
# run by the reusable workflow in ts19980529-dot/code-guardian.
# Requires the Actions secret ANTHROPIC_API_KEY in this repository.
# review.yml is pinned to a reviewed commit. To upgrade, review the diff in
# code-guardian first, then change the SHA below.
name: Code Guardian

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to the same PR cancels the review still running for the old
# commit; the reusable workflow then interrupts and archives that session.
concurrency:
  group: code-guardian-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-guardian:
    # Skip drafts, fork PRs (no secrets there) and Dependabot (separate secrets).
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      pull-requests: write
    uses: ts19980529-dot/code-guardian/.github/workflows/review.yml@e6cb87fe57cb949110854b1898c51d91be1683c0
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
